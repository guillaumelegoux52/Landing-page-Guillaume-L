<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logo 3D</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #canvas3d {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <canvas id="canvas3d"></canvas>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/SVGLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>

  <script>
    const canvas = document.getElementById("canvas3d");
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);

    const renderer = new THREE.WebGLRenderer({
      canvas: canvas,
      antialias: true
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;

    // Caméra orthographique
    const aspect = window.innerWidth / window.innerHeight;
    const frustumSize = 260;

    const camera = new THREE.OrthographicCamera(
      (-frustumSize * aspect) / 2,
      (frustumSize * aspect) / 2,
      frustumSize / 2,
      -frustumSize / 2,
      0.1,
      2000
    );

    camera.position.set(0, 0, 500);
    camera.lookAt(0, 0, 0);

    // Lumières
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.12);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0xffffff, 1.8);
    keyLight.position.set(150, 140, 220);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0xd9e2ff, 0.6);
    fillLight.position.set(-160, 40, 120);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0xffffff, 1.0);
    rimLight.position.set(0, 30, -220);
    scene.add(rimLight);

    const underGlow = new THREE.DirectionalLight(0xff8a2a, 3.1);
    underGlow.position.set(0, -220, 140);
    scene.add(underGlow);

    const warmBounce = new THREE.AmbientLight(0xffa45c, 0.14);
    scene.add(warmBounce);

    // Pivot parent
    const logoPivot = new THREE.Group();
    scene.add(logoPivot);

    const logoGroup = new THREE.Group();
    logoGroup.scale.y = -1;
    logoPivot.add(logoGroup);

    const svgLoader = new THREE.SVGLoader();

    svgLoader.load("./3d assets/logo-gl.svg", function (data) {
      const paths = data.paths;

      const material = new THREE.MeshPhysicalMaterial({
        color: 0xe7e7e8,
        metalness: 1,
        roughness: 0.26,
        clearcoat: 0.18,
        clearcoatRoughness: 0.16,
        reflectivity: 0.88
      });

      paths.forEach((path) => {
        const shapes = THREE.SVGLoader.createShapes(path);

        shapes.forEach((shape) => {
          const geometry = new THREE.ExtrudeGeometry(shape, {
            depth: 32,
            bevelEnabled: false
          });

          geometry.computeVertexNormals();

          const mesh = new THREE.Mesh(geometry, material);
          logoGroup.add(mesh);
        });
      });

      const box = new THREE.Box3().setFromObject(logoGroup);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());

      logoGroup.position.set(-center.x, -center.y, -center.z);

      logoPivot.rotation.x = 0.12;

      const maxDim = Math.max(size.x, size.y, size.z);
      const margin = 1.8;
      const newFrustumSize = maxDim * margin;

      updateCamera(newFrustumSize);
    });

    // Post-processing
    const composer = new THREE.EffectComposer(renderer);
    const renderPass = new THREE.RenderPass(scene, camera);
    composer.addPass(renderPass);

    const bloomPass = new THREE.UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      0.85,
      1.8,
      0.35
    );
    composer.addPass(bloomPass);

    function animate() {
      requestAnimationFrame(animate);

      logoPivot.rotation.y += 0.01;

      composer.render();
    }

    animate();

    function updateCamera(frustum = 260) {
      const aspect = window.innerWidth / window.innerHeight;

      camera.left = (-frustum * aspect) / 2;
      camera.right = (frustum * aspect) / 2;
      camera.top = frustum / 2;
      camera.bottom = -frustum / 2;

      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
    }

    window.addEventListener("resize", () => {
      updateCamera();
    });
  </script>
</body>
</html>
