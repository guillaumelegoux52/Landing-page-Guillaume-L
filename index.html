<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logo 3D</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #canvas3d {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <canvas id="canvas3d"></canvas>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/SVGLoader.js"></script>

  <script>
    const canvas = document.getElementById("canvas3d");
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);

    const renderer = new THREE.WebGLRenderer({
      canvas: canvas,
      antialias: true
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    // Caméra orthographique
    const aspect = window.innerWidth / window.innerHeight;
    const frustumSize = 260;

    const camera = new THREE.OrthographicCamera(
      (-frustumSize * aspect) / 2,
      (frustumSize * aspect) / 2,
      frustumSize / 2,
      -frustumSize / 2,
      0.1,
      2000
    );

    camera.position.set(0, 0, 500);
    camera.lookAt(0, 0, 0);

    // Lumière ambiante très légère
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.18);
    scene.add(ambientLight);

    // Key light (principale)
    const keyLight = new THREE.DirectionalLight(0xffffff, 3.2);
    keyLight.position.set(160, 100, 220);
    scene.add(keyLight);

    // Fill light (remplissage)
    const fillLight = new THREE.DirectionalLight(0xdde7ff, 1.2);
    fillLight.position.set(-140, 40, 120);
    scene.add(fillLight);

    // Rim / back light (contour)
    const rimLight = new THREE.DirectionalLight(0xffffff, 2.4);
    rimLight.position.set(0, 0, -220);
    scene.add(rimLight);

    // Pivot parent
    const logoPivot = new THREE.Group();
    scene.add(logoPivot);

    // Groupe du logo
    const logoGroup = new THREE.Group();
    logoGroup.scale.y = -1;
    logoPivot.add(logoGroup);

    const loader = new THREE.SVGLoader();

    loader.load("./3d assets/logo-gl.svg", function (data) {
      const paths = data.paths;

      const material = new THREE.MeshPhysicalMaterial({
        color: 0xe8e8ea,
        metalness: 1,
        roughness: 0.14,
        clearcoat: 0.35,
        clearcoatRoughness: 0.12,
        reflectivity: 1
      });

      paths.forEach((path) => {
        const shapes = THREE.SVGLoader.createShapes(path);

        shapes.forEach((shape) => {
          const geometry = new THREE.ExtrudeGeometry(shape, {
            depth: 32,
            bevelEnabled: false
          });

          const mesh = new THREE.Mesh(geometry, material);
          logoGroup.add(mesh);
        });
      });

      // Centrage global du logo
      const box = new THREE.Box3().setFromObject(logoGroup);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());

      logoGroup.position.set(-center.x, -center.y, -center.z);

      // Inclinaison légère pour lire le volume
      logoPivot.rotation.x = 0.12;

      // Ajustement auto du cadre orthographique
      const maxDim = Math.max(size.x, size.y, size.z);
      const margin = 1.8;
      const newFrustumSize = maxDim * margin;

      updateCamera(newFrustumSize);
    });

    function animate() {
      requestAnimationFrame(animate);

      logoPivot.rotation.y += 0.01;

      renderer.render(scene, camera);
    }

    animate();

    function updateCamera(frustum = 260) {
      const aspect = window.innerWidth / window.innerHeight;

      camera.left = (-frustum * aspect) / 2;
      camera.right = (frustum * aspect) / 2;
      camera.top = frustum / 2;
      camera.bottom = -frustum / 2;

      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.addEventListener("resize", () => {
      updateCamera();
    });
  </script>
</body>
</html>
